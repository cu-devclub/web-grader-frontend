server {
    listen 80;
    server_name grader.mycourseville.com www.grader.mycourseville.com;

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name grader.mycourseville.com www.grader.mycourseville.com;

    ssl_certificate /etc/letsencrypt/live/grader.mycourseville.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grader.mycourseville.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
